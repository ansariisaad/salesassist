<div class="w-full overflow-hidden">
  <div class="flex justify-center">
    <div class="flex justify-end items-center p-2 w-full">
      <button
        (click)="openModal()"
        class="border mr-5 px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-300 focus:outline-none"
      >
        Add new
      </button>
    </div>
  </div>  

  <!-- Main Content -->
  <div class="container mx-auto p-6 bg-gray-50 rounded-lg shadow-md mt-6"> 
    <!-- Table to display the users -->
    <div class="overflow-x-auto bg-white rounded-lg shadow-md">
      <table class="min-w-full table-auto">
        <thead class="bg-gray-200 text-gray-700">
          <tr>
            <th class="py-3 px-4 text-left">Sr No</th>
            <th class="py-3 px-4 text-left">Dealer Name</th>
            <th class="py-3 px-4 text-left">Dealer Code</th>
            <th class="py-3 px-4 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let dealer of dealerList(); let i = index" class="border-b hover:bg-gray-100 transition-colors">
            <td class="py-3 px-4">{{ i + 1 }}</td>
            <td class="py-3 px-4">
              <a [routerLink]="['/Admin/dealer', dealer.dealer_id]">
                {{ dealer.dealer_name }}
              </a>
            </td>
            <td class="py-3 px-4">
              <a [routerLink]="['/Admin/dealer', dealer.dealer_code]">
                {{ dealer.dealer_code }}
              </a>
            </td>
            <td class=" ">
              <button (click)="openModal(dealer)" class="mr-14 ">
                <i class="fa-solid fa-pen-to-square text-blue-300 hover:text-blue-600"></i>
              </button>
              <button (click)="deleteDealerId(dealer.dealer_id)">
                <i class="fa-solid fa-trash text-blue-300 hover:text-blue-600"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div *ngIf="isModalVisible" class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-50">
    <div class="relative w-full max-w-md p-6 mx-2 bg-white rounded-lg shadow-lg">
      <!-- Modal Header -->
      <div class="flex justify-between items-start pb-4 border-b border-gray-200">
        <h2 class="text-xl font-semibold">{{ dealerObj.dealer_id ? 'Edit Dealer' : 'Add New Dealer' }}</h2>
        <button (click)="closeModal()" class="text-gray-500 hover:text-gray-700">&times;</button>
      </div>

      <!-- Modal Content -->
      <div class="mt-6 p-4 bg-gray-100">
        <div class="mb-4">
          <label>Dealer Name</label>
          <input type="text" class="mt-1 block w-full border" [(ngModel)]="dealerObj.dealer_name" />
        </div>
        <!-- <div class="mb-4">
          <label>Dealer Code</label>
          <input type="text" class="mt-1 block w-full border" [(ngModel)]="dealerObj.dealer_code" />
        </div> -->
      
        <div class="mb-4" *ngIf="!dealerObj.dealer_code || dealerObj.dealer_code.trim() === ''">
          <label>Dealer Code</label>
          <input
            type="text"
            class="mt-1 block w-full border"
            [(ngModel)]="dealerObj.dealer_code" 
          />
        </div>
        
      </div>

      <div class="mt-6 text-right">
        <ng-container *ngIf="dealerObj.dealer_id; else saveButton">
          <button (click)="onUpdate()" class="px-4 py-2 text-white bg-red-500 rounded hover:bg-red-600 focus:outline-none mr-2">
            Edit
          </button>
        </ng-container>

        <ng-template #saveButton>
          <button (click)="createNewDealer()" class="px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-300 focus:outline-none mr-2">
            Save
          </button>
        </ng-template>

        <button (click)="closeModal()" class="px-4 py-2 text-white bg-red-500 rounded hover:bg-red-600 focus:outline-none">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
